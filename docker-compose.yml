version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudops-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudops_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-cloudops_sentinel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops_user -d cloudops_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudops-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://cloudops_user:cloudops_secure_password@postgres:5432/cloudops_sentinel
      JWT_SECRET: ${JWT_SECRET:-cloudops_super_secret_jwt_key_2026_sentinel}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudops-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
